version: 2.1

executors:
  default:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/repo

jobs:
  sync-and-release:
    executor: default
    steps:
      - checkout
      
      - run:
          name: Get version from package.json
          command: |
            VERSION=$(jq -r '.version' frontend/package.json)
            echo "export VERSION=$VERSION" >> $BASH_ENV
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            echo "export TAG=v${VERSION}-${TIMESTAMP}" >> $BASH_ENV
            echo "export SHORT_SHA=${CIRCLE_SHA1:0:7}" >> $BASH_ENV
            source $BASH_ENV
            echo "Version: $VERSION"
            echo "Tag: $TAG"
            echo "Short SHA: $SHORT_SHA"
      
      - run:
          name: Get commit message
          command: |
            MSG=$(git log -1 --pretty=format:"%s" | sed 's/"/\\"/g' | tr '\n' ' ')
            BODY=$(git log -1 --pretty=format:"%b" | sed 's/"/\\"/g' | tr '\n' ' ')
            echo "export COMMIT_MESSAGE=\"$MSG\"" >> $BASH_ENV
            echo "export COMMIT_BODY=\"$BODY\"" >> $BASH_ENV
            source $BASH_ENV
            echo "Commit message: $COMMIT_MESSAGE"
      
      - run:
          name: Checkout target (public) repo
          command: |
            git clone https://x-access-token:${PUBLIC_REPO_PAT}@github.com/HZMonama/regolab-self-host.git public
            cd public
            git config user.name "circleci[bot]"
            git config user.email "circleci[bot]@users.noreply.github.com"
      
      - run:
          name: Copy prod compose file into public repo
          command: |
            mkdir -p public
            cp docker-compose.prod.yml public/docker-compose.prod.yml
      
      - run:
          name: Commit and push if changed
          working_directory: public
          command: |
            if [ -n "$(git status --porcelain)" ]; then
              git add docker-compose.prod.yml
              git commit -m "Sync docker-compose.prod.yml from regolab @${SHORT_SHA}"
              git push origin HEAD:main
              echo "Pushed updated docker-compose.prod.yml to regolab-self-host"
            else
              echo "No changes to commit"
            fi
      
      - run:
          name: Create release on public repo
          command: |
            RELEASE_BODY=$(cat <<EOF
            ## Changes

            ${COMMIT_MESSAGE}

            ---

            📦 **Docker Images:**
            - \`ghcr.io/hzmonama/regolab-frontend:latest\`
            - \`ghcr.io/hzmonama/regolab-backend:latest\`

            🔗 Synced from private repo commit: \`${SHORT_SHA}\`

            ### Quick Start
            \`\`\`bash
            curl -O https://raw.githubusercontent.com/HZMonama/regolab-self-host/main/docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml up -d
            \`\`\`
            EOF
            )
            
            # Create release using GitHub API
            curl -X POST \
              -H "Authorization: token ${PUBLIC_REPO_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/HZMonama/regolab-self-host/releases \
              -d "{
                \"tag_name\": \"${TAG}\",
                \"name\": \"RegoLab ${TAG}\",
                \"body\": $(echo "$RELEASE_BODY" | jq -Rs .),
                \"draft\": false,
                \"prerelease\": false
              }"

workflows:
  version: 2
  sync-workflow:
    jobs:
      - sync-and-release:
          filters:
            branches:
              only:
                - main
          context:
            - regolab-secrets
